# camera-lab post filters (layer 2): one per line,
#
#   name|lavfi chain|note|flags
#
# name:  letters, digits, dot, dash, underscore; a later line with the same
#        name replaces an earlier one (so ~/.config/camera-lab/presets.conf can
#        override these).
# chain: an FFmpeg filter chain that takes one video input and gives one
#        output. Internal labels ([a], [m]) are fine: camera-lab renames them
#        per stage, so a preset can be stacked twice. In a chain with several
#        segments (`;`), the first filter takes the input and the last one
#        gives the output. Don't use `|`.
# note:  one line shown in the menu.
# flags: optional, comma separated. `slow`: expected not to hold 30 fps at
#        1920x1080, so `live` offers it at 1280x720 only (clip mode runs it at
#        any size). `temporal`: uses earlier frames, so it needs a second to
#        settle after a change and smears motion.
#
# The `slow` flags follow `camera-lab clip`'s render fps on the J616c
# (2026-11-20, 1920x1080, offline on all 14 cores): nlmeans 5 fps and
# vaguedenoiser 32 fps are slow; fftdnoiz 154, median 101 and despeckle 95 are
# not. Live needs 30 on top of the filter's own work, so a flag can move.

# Denoise
hqdn3d-light|hqdn3d=2:1.5:3:2.25|Spatial + temporal denoise at half FFmpeg's defaults|temporal
hqdn3d-medium|hqdn3d=4:3:6:4.5|Spatial + temporal denoise at FFmpeg's defaults|temporal
hqdn3d-temporal|hqdn3d=0:0:6:4.5|hqdn3d's temporal part only: no spatial blur|temporal
atadenoise|atadenoise=0a=0.02:1a=0.04:2a=0.04:0b=0.04:1b=0.08:2b=0.08:s=9|Adaptive temporal average over 9 frames|temporal
tmix-2|tmix=frames=2|Mean of the last 2 frames: ghosts on motion|temporal
tmix-3|tmix=frames=3|Mean of the last 3 frames: more ghosting|temporal
nlmeans|nlmeans=s=2:p=5:r=9|Non-local means, spatial only, strong on flat areas|slow
vaguedenoiser|vaguedenoiser=threshold=3:method=soft:nsteps=5|Wavelet denoise, spatial|slow
median|median=radius=1|Plain 3x3 median: removes specks and fine texture|
despeckle|split[a][b];[b]median=radius=1[m];[a][m]lut2=c0='if(gt(abs(x-y),12),y,x)':c1=x:c2=x|3x3 median only where luma is more than 12 off it (the research's test)|
despeckle-dark|split[a][b];[b]median=radius=1[m];[a][m]lut2=c0='if(gt(y-x,12),y,x)':c1=x:c2=x|Same, dark outliers only (most specks are dark)|
fftdnoiz|fftdnoiz=sigma=4:amount=0.8|FFT denoise, spatial|

# Sharpen
unsharp-light|unsharp=5:5:0.4:5:5:0|Luma unsharp mask, light|
unsharp-medium|unsharp=5:5:0.8:5:5:0|Luma unsharp mask, medium|
cas|cas=strength=0.4|Contrast-adaptive sharpening|

# Tone and colour
gamma-lift|eq=gamma=1.1|Lift mid-tones (gamma 1.1)|
contrast-sat|eq=contrast=1.06:saturation=1.12|A little more contrast and saturation|
curves-s|curves=all='0/0 0.25/0.22 0.75/0.78 1/1'|Gentle S-curve|
shadow-lift|curves=all='0/0 0.08/0.10 0.25/0.27 0.55/0.56 0.85/0.85 1/1',eq=contrast=1.03:saturation=1.05|Slight shadow lift with the contrast kept, a global stand-in for macOS's local tone mapping|
warm|colortemperature=temperature=5600|Warmer white balance|
cool|colortemperature=temperature=7400|Cooler white balance|
vibrance|vibrance=intensity=0.15|Saturate the dull colours only|
deband|deband|Smooth banding in flat gradients|

# Edge-preserving smoothers: flat areas smooth, edges kept (the userspace cousin of macOS's face-aware NR)
bilateral|bilateral=sigmaS=3:sigmaR=0.06|Bilateral: smooth flat areas, keep edges (sigmaR is the edge threshold)|
bilateral-strong|bilateral=sigmaS=4:sigmaR=0.10|Bilateral, stronger: more smoothing, softer fine texture|
smartblur|smartblur=lr=2.0:ls=0.8:lt=10|Smart blur: blur only where local contrast is under the threshold|

# Lens shading for the binned sensor mode (config 8, crop 1216): the ISP doesn't correct it there.
# The gain map comes from shading-gain.py (see its header); CAMERA_LAB_OUT/shading/gain-binned1216.png.
shading-binned1216|format=gbrp[a];movie=${CL_OUT}/shading/gain-binned1216.png,format=gbrp[g];[g][a]scale2ref[g2][a2];[a2][g2]blend=all_expr='min(A*B/128,255)',format=yuv420p|Multiply by the fitted shading gain (binned config 8, crop 1216; this unit)|
shading-sat|format=gbrp[a];movie=${CL_OUT}/shading/gain-binned1216.png,format=gbrp[g];[g][a]scale2ref[g2][a2];[a2][g2]blend=all_expr='min(A*B/128,255)',format=yuv420p,eq=saturation=1.15|The shading gain plus the saturation macOS shows (1.15)|

# Local contrast, the ffmpeg stand-in for macOS's local tone mapping: a wide, weak unsharp mask
clarity|split[a][b];[b]gblur=sigma=25[m];[a][m]blend=all_expr='min(max(A+0.35*(A-B),0),255)'|Local contrast: lifts shadows and adds punch region by region, no global paleness|
clarity-strong|split[a][b];[b]gblur=sigma=25[m];[a][m]blend=all_expr='min(max(A+0.6*(A-B),0),255)'|Local contrast, stronger|
macos-like|eq=saturation=1.15,split[a][b];[b]gblur=sigma=25[m];[a][m]blend=all_expr='min(max(A+0.35*(A-B),0),255)',cas=strength=0.3|Saturation 1.15, clarity and light sharpening together|

# Size
scale-720p|scale=1280:720:flags=lanczos|1080p captured, scaled to 720p (lanczos): what a 720p app would get with the 1080p-only Neural Engine stage|
