# omarchy-m4 OMS-17: count Aurora's Stage 2 trial guard from when the booted
# system starts, not from kernel start.
#
# aurora-stage2-guard.timer (asahi-scripts) fires OnBootSec=12min and reboots
# to the configured Stage 2 unless aurora-stage2-commit.service has committed
# the trial by then. OnBootSec counts from kernel start, so on an encrypted
# install the time spent at the disk-password prompt counts too. Past 12
# minutes, the timer is already due when the root comes up and can run the
# guard before the commit service (After=multi-user.target) gets its chance;
# the attempt record then keeps that candidate from being tried again.
#
# The timer is activated in the booted system (timers.target), after the
# root is unlocked, so OnActiveSec gives the trial its 12 minutes from there.
# The empty OnBootSec= clears Aurora's trigger first.
[Timer]
OnBootSec=
OnActiveSec=12min
