# Echo cancellation for the J616c's built-in speakers and microphones (OMS-44).
#
# Installed as /etc/pipewire/pipewire.conf.d/50-j616c-echo-cancel.conf by
# tools/derive-j616c-image. tools/echo-cancel-trial runs the same block in a
# separate PipeWire process for a trial without installing anything.
#
# Without it, people in calls hear themselves: the speakers' echo reaches the
# mics 14 to 16 dB below what was played, about 100 ms later, and the app's own
# canceller (Chromium's WebRTC AEC3 in Teams for Linux) can't remove it, as
# asahi-audio's speaker graph (Bankstown bass, compressors, limiters) changes
# the sound after the app plays it. Measured coherence between what the app
# plays and the echo is 0.75 to 0.95, a cap of 6 to 13 dB for any linear
# canceller. PipeWire's WebRTC canceller, fed the speaker sink's monitor,
# removed 42 to 55 dB of echo on the Mac (JOURNEY 9.56).
#
# - Reference: the monitor of asahi-audio's J616 speaker sink
#   (audio_effect.j616-convolver), so the default output stays that sink.
#   Headphones (the jack card) bypass it, and the reference is then silence.
# - Microphone: omarchy-mac's stereo mapping (omarchy_asahi_mic), downmixed to
#   mono, so its volume and mute still apply. It never falls back to another
#   source.
# - Its source outranks the DSP microphone (2005) and stays below a plugged-in
#   headset (2100), so on a fresh install it should be the default input, and
#   omarchy-mac's mapper, which claims the default only from nothing or the
#   DSP microphone, should leave it (not yet checked on a fresh install).
# - Gain control is off: the mic path already has its gain (OMS-9).
context.modules = [
  { name = libpipewire-module-echo-cancel
    flags = [ nofail ]
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = true
      audio.rate = 48000
      aec.args = {
        webrtc.gain_control = false
        webrtc.noise_suppression = true
        webrtc.high_pass_filter = true
      }
      capture.props = {
        node.name = "j616c_echo_cancel.capture"
        target.object = "omarchy_asahi_mic"
        node.dont-fallback = true
        node.passive = true
        audio.channels = 1
        audio.position = [ MONO ]
      }
      source.props = {
        node.name = "j616c_echo_cancel.source"
        node.description = "MacBook Microphone (echo cancelled)"
        media.class = Audio/Source
        priority.session = 2010
        device.icon-name = "audio-input-microphone"
        audio.channels = 1
        audio.position = [ MONO ]
      }
      # In monitor mode the reference is a capture of the sink's monitor, and
      # it takes sink.props (playback.props would be ignored).
      sink.props = {
        node.name = "j616c_echo_cancel.reference"
        target.object = "audio_effect.j616-convolver"
        node.dont-fallback = true
        node.passive = true
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
