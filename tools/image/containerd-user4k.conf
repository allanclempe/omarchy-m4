# OMS-41: run containerd, and so every container it starts, with 4 KiB user
# pages (Aurora's aurora-userpages; needs user4k=on on the kernel command line).
# x86-64 images run under qemu-user, and their libraries are linked for 4 KiB
# pages: on the J616c's 16 KiB kernel they fail with "failed to map segment from
# shared object". Native arm64 containers are unaffected apart from the page size.
[Service]
ExecStart=
ExecStart=/usr/bin/userpages 4k /usr/bin/containerd
